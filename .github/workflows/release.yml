name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build-mv3

      - name: Extract version
        id: version
        run: echo "version=$(jq -r .version manifest.mv3.json)" >> $GITHUB_OUTPUT

      - name: Unzip build
        run: |
          mkdir -p dist
          unzip -o web-ext-artifacts/control_panel_for_twitter-${{ steps.version.outputs.version }}.mv3.zip -d dist

      - name: Create CRX
        run: |
          cd dist
          zip -r ../control-panel-for-twitter.crx .

      - name: Create updates.xml
        run: |
          cat > updates.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="mijcgjehgneckmejljjmbfcfkfmjdmlb">
              <updatecheck codebase="https://github.com/${{ github.repository }}/releases/latest/download/control-panel-for-twitter.crx" version="${{ steps.version.outputs.version }}"/>
            </app>
          </gupdate>
          EOF

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest control-panel-for-twitter.crx updates.xml --clobber || \
          gh release create latest control-panel-for-twitter.crx updates.xml \
            --title "Latest Release" \
            --notes "Latest stable release"
